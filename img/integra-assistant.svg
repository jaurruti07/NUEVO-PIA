<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Light Blue / Cyan Gradient -->
    <linearGradient id="celesteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00C2E0"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Hair / Head Accent Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Face / Skin Light Soft Tone -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Suit / Collar Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#134074"/>
    </linearGradient>

    <!-- Cyan Headset Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Circle Frame in Tonalidad Celeste -->
  <circle cx="64" cy="64" r="62" fill="url(#celesteBg)"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Inner Soft Glow Circle -->
  <circle cx="64" cy="64" r="54" fill="#05111F" fill-opacity="0.2"/>

  <!-- Body / Formal Suit (Persona Asistente) -->
  <path d="M 28,110 C 28,88 42,80 64,80 C 86,80 100,88 100,110 Z" fill="url(#suitGrad)"/>
  
  <!-- White Formal Shirt Collar (V-neck) -->
  <polygon points="64,96 52,80 76,80" fill="#FFFFFF"/>
  <polygon points="64,96 58,80 70,80" fill="#E2E8F0"/>

  <!-- Tie / Formal Cyan Badge Line -->
  <polygon points="64,84 61,102 64,106 67,102" fill="#00C2E0"/>

  <!-- Neck -->
  <rect x="57" y="68" width="14" height="14" rx="3" fill="#E2E8F0"/>

  <!-- Head / Hair Back Layer -->
  <path d="M 40,48 C 38,28 50,22 64,22 C 78,22 90,28 88,48 C 88,58 84,68 84,68 L 44,68 C 44,68 40,58 40,48 Z" fill="url(#hairGrad)"/>

  <!-- Face Shape -->
  <path d="M 46,44 C 46,36 52,34 64,34 C 76,34 82,36 82,44 C 82,58 76,68 64,68 C 52,68 46,58 46,44 Z" fill="url(#skinGrad)"/>

  <!-- Elegant Hair Style (Parted professional look) -->
  <path d="M 42,42 C 42,28 52,24 64,24 C 72,24 84,28 86,40 C 80,33 70,32 61,35 C 53,38 46,40 42,42 Z" fill="#1E293B"/>

  <!-- Eyes (Friendly Formal Look) -->
  <ellipse cx="55" cy="48" rx="2.5" ry="3.5" fill="#0F172A"/>
  <ellipse cx="73" cy="48" rx="2.5" ry="3.5" fill="#0F172A"/>
  <circle cx="56" cy="47" r="0.8" fill="#FFFFFF"/>
  <circle cx="74" cy="47" r="0.8" fill="#FFFFFF"/>

  <!-- Gentle Professional Smile -->
  <path d="M 58,58 Q 64,63 70,58" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>

  <!-- Virtual Assistant Headset (Audífono con Micrófono) in Cyan/Celeste -->
  <!-- Headset Band -->
  <path d="M 42,44 C 40,28 52,22 64,22 C 76,22 88,28 86,44" fill="none" stroke="#00C2E0" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Left Earpiece Pad -->
  <rect x="39" y="40" width="6" height="12" rx="3" fill="#00C2E0" stroke="#05111F" stroke-width="1.5"/>

  <!-- Right Earpiece Pad with Mic Boom -->
  <rect x="83" y="40" width="6" height="12" rx="3" fill="#00C2E0" stroke="#05111F" stroke-width="1.5"/>

  <!-- Microphone Arm curving towards mouth -->
  <path d="M 86,48 Q 88,60 72,62" fill="none" stroke="#00C2E0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Microphone Capsule -->
  <circle cx="71" cy="62" r="3" fill="#00C2E0" stroke="#05111F" stroke-width="1" filter="url(#cyanGlow)"/>

  <!-- Sparkle / AI Integrity Indicator (Light Celeste Star) -->
  <path d="M 102,28 L 104,33 L 109,35 L 104,37 L 102,42 L 100,37 L 95,35 L 100,33 Z" fill="#E0F2FE" opacity="0.9"/>
  <path d="M 24,36 L 25.5,39.5 L 29,41 L 25.5,42.5 L 24,46 L 22.5,42.5 L 19,41 L 22.5,39.5 Z" fill="#38BDF8" opacity="0.8"/>
</svg>
